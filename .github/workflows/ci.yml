name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run typecheck

  # `bun run release` pushes a v* tag: package it and upload to CurseForge and GitHub Releases.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the packager and git-cliff need the full history and tags
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Only this release's notes go to CurseForge and GitHub (manual-changelog in .pkgmeta).
      - run: bunx git-cliff --latest --strip header --output CHANGELOG.md
      - uses: BigWigsMods/packager@v2
        with:
          args: -p 1795191
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
